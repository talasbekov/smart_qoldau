server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Flutter Web с go_router: маршруты вида /offers обслуживает само
  # приложение, поэтому любой путь отдаёт index.html — иначе перезагрузка
  # страницы на разделе даёт 404 от nginx вместо кабинета.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Точки входа обязаны быть свежими: иначе после выката человек неделю
  # сидит на старом кабинете. Ассеты (assets/, canvaskit/) в этот список не
  # входят — их имена и содержимое меняются вместе с бандлом, который их
  # запрашивает.
  #
  # Почему сюда попал и сам бандл: у Flutter Web имена `main.dart.js` и
  # `flutter_bootstrap.js` постоянны от сборки к сборке, версии в них нет.
  # Без явного заголовка браузер кеширует их эвристически и продолжает
  # выполнять старый код при живом index.html — так и вышло на стенде,
  # где кабинет ещё долго стучался по адресу выключенного туннеля.
  # `no-cache` не запрещает кеш, а требует ревалидации: ETag есть, поэтому
  # обычный ответ — дешёвый 304, а после выката приезжает новый бандл.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store";
  }
  location ~ ^/(main\.dart\.js|flutter_bootstrap\.js|flutter\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
