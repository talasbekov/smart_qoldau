name: admin

on:
  pull_request:
    paths: ['admin/**']
  push:
    branches: [main]
    paths: ['admin/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
