server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Flutter Web с go_router: маршруты вида /offers обслуживает само
  # приложение, поэтому любой путь отдаёт index.html — иначе перезагрузка
  # страницы на разделе даёт 404 от nginx вместо кабинета.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Бандл и ассеты у Flutter версионируются по содержимому сборки, но
  # index.html и flutter_service_worker.js обязаны быть свежими: иначе
  # после выката человек неделю сидит на старом кабинете.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /flutter_service_worker.js {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
