name: shared
description: "A new Flutter package project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # Шина реалтайм-событий (задача 8): бэкенд поднимает socket.io на
  # неймспейсе `/ws` (не голый WebSocket) — см. `backend/src/ws`.
  socket_io_client: ^3.1.6
  # Транзитивная зависимость socket_io_client — объявлена явно, потому что
  # sq_socket.dart напрямую ссылается на `WebSocketConnectionClosed` (см.
  # отчёт задачи 8, раунд правок 1, п.1-2).
  web_socket: ^1.0.1
  # @visibleForTesting на диагностическом `SocketIoSqSocket.debugZone`.
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  # freezed 3.x (стабильный на момент написания) генерирует конструкторные
  # параметры коллекций как `final List<T> x` без `this.` — этот модификатор
  # `final` на обычном формальном параметре Dart 3.13 отклоняет как
  # extraneous_modifier (грамматика ужесточилась). Зафиксировано на
  # 4.0.0-dev.3 — первой версии, которая это уже не генерирует; следить за
  # выходом стабильного freezed 4.0.0 и снять пин.
  freezed: 4.0.0-dev.3
  json_serializable: ^6.14.1
  # Тест задачи 21 читает секцию fonts из этого же pubspec.
  yaml: ^3.1.2
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
  # Inter забандлен в пакет (задача 21 эпика E6): интерфейс не зависит от
  # сети, а тесты не печатают предупреждений о неудачной загрузке шрифта.
  # Лицензия — assets/fonts/OFL.txt (SIL OFL 1.1).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
