server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA на react-router: любой путь отдаёт index.html, иначе перезагрузка
  # страницы на /verification даёт 404 от nginx, а не экран админки.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Хэшированные ассеты Vite неизменяемы — кэшируются навсегда; index.html
  # не кэшируется, иначе после выката люди неделю сидят на старом бандле.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
