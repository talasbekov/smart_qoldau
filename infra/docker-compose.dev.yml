services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: sq, POSTGRES_PASSWORD: sq, POSTGRES_DB: smartqoldau }
    ports: ["5432:5432"]
  postgres_test:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: sq, POSTGRES_PASSWORD: sq, POSTGRES_DB: smartqoldau_test }
    ports: ["5433:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: sq-minio, MINIO_ROOT_PASSWORD: sq-minio-secret }
    ports: ["9000:9000", "9001:9001"]
  # Опционален: нужен только для ручной проверки чата/аудио/видео (E4). Тесты
  # LiveKit не поднимают и не требуют.
  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    ports: ["7880:7880"]
