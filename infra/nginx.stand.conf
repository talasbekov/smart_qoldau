# Обратный прокси тестового стенда: один вход, за ним админка и API.
# Именно один — публичный туннель даёт один адрес, а держать админку и
# бэкенд на разных хостах значит ещё и разбираться с CORS ради демо.
server {
  listen 80;
  server_name _;

  # API. Слэш в конце proxy_pass не ставим: путь /v1/... должен доехать
  # до бэкенда как есть, он сам живёт под этим префиксом.
  location /v1/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket (чат и события консультаций) — без апгрейда соединения
    # приложение молча теряет живые обновления.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }

  # Админка — под префиксом: корень занят продуктом. Сборка знает свою
  # базу (VITE_BASE), роутер — тот же basename.
  location /admin/ {
    proxy_pass http://admin:80/;
    proxy_set_header Host $host;
  }

  # Всё остальное — веб-приложение: лендинг, каталог, профили, кабинеты.
  # Сборки Flutter Web (/expert/ и /app/) выключены вместе с эпиком E16:
  # веб пишется на веб-стеке, мобильные приложения остаются на Flutter.
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
