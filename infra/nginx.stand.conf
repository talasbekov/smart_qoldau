# Обратный прокси тестового стенда: один вход, за ним админка и API.
# Именно один — публичный туннель даёт один адрес, а держать админку и
# бэкенд на разных хостах значит ещё и разбираться с CORS ради демо.
server {
  listen 80;
  server_name _;

  # API. Слэш в конце proxy_pass не ставим: путь /v1/... должен доехать
  # до бэкенда как есть, он сам живёт под этим префиксом.
  location /v1/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket (чат и события консультаций) — без апгрейда соединения
    # приложение молча теряет живые обновления.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }

  # Кабинет эксперта, собранный под веб (спайк: проверяем, что Flutter Web
  # вообще живёт против настоящего бэкенда). Отдаётся статикой с того же
  # домена, поэтому CORS не нужен.
  location /expert/ {
    proxy_pass http://expert-web:80/;
    proxy_set_header Host $host;
  }

  # Веб-версия клиента.
  location /app/ {
    proxy_pass http://client-web:80/;
    proxy_set_header Host $host;
  }

  # Всё остальное — админка (SPA, свои маршруты разруливает сама).
  location / {
    proxy_pass http://admin:80;
    proxy_set_header Host $host;
  }
}
