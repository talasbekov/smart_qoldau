# Обратный прокси тестового стенда: один вход, за ним админка и API.
# Именно один — публичный туннель даёт один адрес, а держать админку и
# бэкенд на разных хостах значит ещё и разбираться с CORS ради демо.
server {
  listen 80;
  server_name _;

  # API. Слэш в конце proxy_pass не ставим: путь /v1/... должен доехать
  # до бэкенда как есть, он сам живёт под этим префиксом.
  location /v1/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket (чат и события консультаций) — без апгрейда соединения
    # приложение молча теряет живые обновления.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }

  # Админка — под префиксом: корень занят продуктом. Сборка знает свою
  # базу (VITE_BASE), роутер — тот же basename.
  location /admin/ {
    proxy_pass http://admin:80/;
    proxy_set_header Host $host;
  }

  # Только объекты закрытого content-бакета. Имя подставляется из
  # той же compose-переменной, что и backend signer. Bucket root не
  # проксируем: ListObjects не становится edge-операцией.
  location = /${S3_BUCKET_CONTENT}/ {
    access_log off;
    return 404;
  }

  location ^~ /${S3_BUCKET_CONTENT}/ {
    # GET-only проверяется явно: nginx limit_except GET неявно
    # разрешает и HEAD, что для этого signer-маршрута неверно.
    if ($request_method != GET) { return 405; }

    # Без trailing slash URI не переписывается. MinIO получает ровно
    # те Host и canonical URI, которые вошли в SigV4.
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    # Query содержит краткоживущую bearer-подпись. access_log off
    # не затрагивает error log: при upstream failure nginx пишет туда
    # request/upstream URI вместе с подписью. Глушим error log только в
    # этом bearer-location; остальные stand-маршруты продолжают логироваться.
    access_log off;
    error_log /dev/null;
  }

  # Всё остальное — веб-приложение: лендинг, каталог, профили, кабинеты.
  # Сборки Flutter Web (/expert/ и /app/) выключены вместе с эпиком E16:
  # веб пишется на веб-стеке, мобильные приложения остаются на Flutter.
  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
