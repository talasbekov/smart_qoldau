# Наложение на docker-compose.prod.yml для ВРЕМЕННОГО тестового стенда,
# который выставляется наружу туннелем.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.stand.yml up -d
#
# Отличия от боевого контура — ровно два, и оба осознанные:
#   * добавлен edge-прокси: публичный туннель даёт один адрес, а за ним
#     нужно раздать и админку, и API;
#   * TOTP_REQUIRED=false, иначе первый вход в админку упирается в
#     привязку второго фактора, а на стенде его некуда привязывать.
# В бою обе поблажки недопустимы.
services:
  backend:
    environment:
      TOTP_REQUIRED: 'false'

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.stand.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8080:80'
    depends_on: [backend, admin, expert-web, client-web]
    networks: [edge]

  # Админка собирается с относительным адресом API: за прокси она и бэкенд
  # на одном источнике, поэтому абсолютный адрес туннеля в бандл вшивать не
  # нужно — и образ не привязан к конкретной ссылке.
  admin:
    build:
      args:
        VITE_API_BASE_URL: /v1

  # На стенде адрес API относительный: кабинет и бэкенд за одним прокси.
  expert-web:
    build:
      args:
        API_BASE_URL: /v1
        WS_BASE_URL: ''

  client-web:
    build:
      args:
        API_BASE_URL: /v1
        WS_BASE_URL: ''
