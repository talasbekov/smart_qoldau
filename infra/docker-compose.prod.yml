# Контур пилота. Отличия от dev-компоуза не косметические:
#   * никаких паролей в файле — всё из .env рядом (см. .env.prod.example);
#   * базы и хранилище на именованных томах, а не в контейнерном слое;
#   * порты наружу открывает только реверс-прокси, остальное — во
#     внутренней сети;
#   * миграции накатывает отдельный одноразовый сервис, а не сам API:
#     иначе несколько реплик стартуют и накатывают схему одновременно.
#
# Запуск: docker compose -f docker-compose.prod.yml --env-file .env up -d
name: smartqoldau

x-default-logging: &default-logging
  # Локальная ротация Docker stdout/stderr; сохраняет `docker compose logs`.
  # До трёх файлов по 10 MiB на контейнер, без затрагивания томов с данными.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # Лимиты троттлинга, дедлайны офферов и presence живут здесь. Данные
    # переживают рестарт: без persistence перезапуск Redis обнуляет
    # счётчики лимитов и теряет дедлайны неотвеченных офферов.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Одноразовый шаг: накатывает миграции и завершается. API ждёт его
  # успешного завершения — реплики не гонятся за схему между собой.
  migrate:
    image: ${BACKEND_IMAGE:-smartqoldau-backend:latest}
    build:
      context: ../backend
    restart: 'no'
    logging: *default-logging
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  backend:
    image: ${BACKEND_IMAGE:-smartqoldau-backend:latest}
    build:
      context: ../backend
    restart: unless-stopped
    logging: *default-logging
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Обязательны в бою (см. README «Границы приёма данных»):
      TOTP_REQUIRED: 'true'
      THROTTLE_ENABLED: 'true'
      # SWAGGER_ENABLED НЕ задаётся: в production документация закрыта по
      # умолчанию, и включать её здесь нечем.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [internal, edge]

  admin:
    image: ${ADMIN_IMAGE:-smartqoldau-admin:latest}
    build:
      context: ../admin
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    restart: unless-stopped
    logging: *default-logging
    depends_on: [backend]
    networks: [edge]



  web:
    image: ${WEB_IMAGE:-smartqoldau-web:latest}
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
    environment:
      API_BASE_URL: http://backend:3000/v1
      SITE_URL: ${SITE_URL:-https://smartqoldau.kz}
    restart: unless-stopped
    logging: *default-logging
    networks: [edge]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  # База, Redis и хранилище наружу не смотрят вовсе.
  internal:
  # Сюда же подключается реверс-прокси с TLS (в этом файле его нет
  # намеренно — сертификаты и домены зависят от площадки).
  edge:
